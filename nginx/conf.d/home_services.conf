# 1. HTTP Redirect to HTTPS (Force Security)
server {
    listen 80;
    listen [::]:80;
    server_name pm-dm-hm.net assistant.pm-dm-hm.net;

    # 1. Clear text exception rule for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 2. Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Home Dashboard (e.g., Home Assistant or landing page)
server {
    listen 443 ssl;
    server_name assistant.pm-dm-hm.net; # Replace with your subdomain

    # SSL Placeholder Paths (We will generate these in the next step)
    ssl_certificate /etc/letsencrypt/live/pm-dm-hm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm-dm-hm.net/privkey.pem;
    
    # Modern secure SSL settings that aren't CPU heavy
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://10.8.0.2:8123; # Port of your dashboard on your home server
        
        # Essential headers so apps know the real client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Crucial for live dashboards, Home Assistant, etc.)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

