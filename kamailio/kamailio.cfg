#!KAMAILIO
# Core Kamailio Configuration for OCI Gateway Proxy

#!define WITH_NAT

####### Global Parameters #######
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

fork=yes
children=4

/* Bind natively to all host interfaces (since we use host network mode) */
listen=udp:0.0.0.0:5060

####### Modules Section #######
mpath="/usr/lib/kamailio/modules/"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "rtpengine.so"
loadmodule "ctl.so"

# ----------------- Module Settings -----------------
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

####### Routing Logic #######
route {
    # Initial sanity checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        # Sequential request processing within an active dialog
        if (loose_route()) {
            route(RELAY);
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    route(RELAY);
                    exit;
                } else {
                    exit;
                }
            }
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    # Cancel processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle INVITE requests
    if (is_method("INVITE")) {
        record_route();
        route(RELAY);
        exit;
    }

    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
